name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 📦 Install Node Dependencies
        run: npm ci

      - name: 🧪 Run Unit Tests
        run: npm test

      - name: 🏗️ Build Next.js Production Bundle
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_placeholder' }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://chatsphere-tan.vercel.app' }}
        run: npm run build

      - name: 📲 Sync Assets to Native Android Platform
        run: |
          mkdir -p out android/app/src/main/assets
          npx cap sync android

      - name: 🤖 Build Android Debug APK
        working-directory: android
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 🏷️ Copy and Rename APK Artifact
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/AetherChat-v1.0.${{ github.run_number }}.apk

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-chat-apk-v1.0.${{ github.run_number }}
          path: build-artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🚀 Publish GitHub Release
        if: (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Aether Chat v1.0.{0}', github.run_number) }}
          files: |
            build-artifacts/app-debug.apk
            build-artifacts/AetherChat-v1.0.${{ github.run_number }}.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
