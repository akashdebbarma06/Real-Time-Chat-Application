name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 📦 Install Node Dependencies
        run: npm ci

      - name: 🧪 Run Unit Tests
        run: npm test

      - name: 🏗️ Build Next.js Production Bundle
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_placeholder' }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://chatsphere-tan.vercel.app' }}
        run: npm run build

      - name: 📲 Sync Assets to Native Android Platform
        run: |
          mkdir -p out android/app/src/main/assets
          npx cap sync android

      - name: 🤖 Build Android Debug APK
        working-directory: android
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 🔐 Configure & Build Signed Release APK (if release secrets present)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore
          export ANDROID_KEYSTORE_PATH="app/release.keystore"
          ./gradlew assembleRelease
          rm -f app/release.keystore

      - name: 🏷️ Collect APK Artifacts
        run: |
          mkdir -p build-artifacts
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/app-debug.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/AetherChat-debug-v1.0.${{ github.run_number }}.apk
          fi
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk build-artifacts/app-release.apk
            cp android/app/build/outputs/apk/release/app-release.apk build-artifacts/AetherChat-release-v1.0.${{ github.run_number }}.apk
          fi

      - name: 📤 Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aether-chat-apk-v1.0.${{ github.run_number }}
          path: build-artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🚀 Publish GitHub Release (Tagged Releases Only)
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ format('Aether Chat {0}', github.ref_name) }}
          files: build-artifacts/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
