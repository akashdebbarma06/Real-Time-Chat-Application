name: CI Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality-gates:
    name: Lint, Typecheck, Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Lint Codebase
        run: npm run lint

      - name: 📐 Static Typecheck
        run: npm run typecheck

      - name: 🧪 Run Vitest Unit Tests
        run: npm test

      - name: 🏗️ Production Web Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_placeholder' }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://chatsphere-tan.vercel.app' }}
        run: npm run build

  android-build-check:
    name: Android Build Validation
    runs-on: ubuntu-latest
    needs: web-quality-gates

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 📦 Install Node Dependencies & Build Web Assets
        env:
          NEXT_PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_placeholder'
          NEXT_PUBLIC_SITE_URL: 'https://chatsphere-tan.vercel.app'
        run: |
          npm ci
          npm run build
          mkdir -p out android/app/src/main/assets
          npx cap sync android

      - name: 🤖 Validate Android Debug Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
