<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="AetherChat - High-performance real-time messaging application." />
  <title>AetherChat</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --bg: #09090b;
      --card: #121215;
      --border: #27272a;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --primary: #7c3aed;
      --primary-gradient: linear-gradient(135deg, #7c3aed 0%, #6366f1 100%);
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    #app-root {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      padding: env(safe-area-inset-top, 24px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 24px) env(safe-area-inset-left, 16px);
      z-index: 10;
    }
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      animation: fadeIn 0.4s ease-out forwards;
    }
    .logo-container {
      position: relative;
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-glow {
      position: absolute;
      inset: -12px;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.45) 0%, rgba(99, 102, 241, 0) 70%);
      border-radius: 50%;
      filter: blur(14px);
      animation: pulseGlow 2.8s infinite ease-in-out;
    }
    .logo-box {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 22px;
      background: var(--primary-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px -8px rgba(124, 58, 237, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .logo-icon {
      width: 44px;
      height: 44px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .brand-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(180deg, #ffffff 0%, #d4d4d8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status-text {
      font-size: 14px;
      color: var(--muted);
      font-weight: 400;
      letter-spacing: 0.01em;
      min-height: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(124, 58, 237, 0.25);
      border-top-color: #a78bfa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .offline-badge {
      display: none;
      margin-top: 16px;
      padding: 8px 14px;
      border-radius: 9999px;
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      font-size: 13px;
      font-weight: 500;
      align-items: center;
      gap: 6px;
    }
    .offline-badge.visible {
      display: inline-flex;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; transform: scale(0.96); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="app-root">
    <div class="splash-container">
      <div class="logo-container">
        <div class="logo-glow"></div>
        <div class="logo-box">
          <svg class="logo-icon" viewBox="0 0 24 24">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
        </div>
      </div>
      <div class="brand-title">AetherChat</div>
      <div class="status-text">
        <div class="spinner" id="loading-spinner"></div>
        <span id="status-label">Initializing secure environment...</span>
      </div>
      <div class="offline-badge" id="offline-badge">
        <span>Offline — reconnecting</span>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const statusLabel = document.getElementById('status-label');
      const offlineBadge = document.getElementById('offline-badge');
      const spinner = document.getElementById('loading-spinner');

      function updateStatus(text, showSpinner = true) {
        if (statusLabel) statusLabel.textContent = text;
        if (spinner) spinner.style.display = showSpinner ? 'inline-block' : 'none';
      }

      function updateNetworkState() {
        if (navigator.onLine) {
          if (offlineBadge) offlineBadge.classList.remove('visible');
        } else {
          if (offlineBadge) offlineBadge.classList.add('visible');
          updateStatus('Awaiting internet connection...', false);
        }
      }

      window.addEventListener('online', updateNetworkState);
      window.addEventListener('offline', updateNetworkState);
      updateNetworkState();

      // Native Capacitor bridge detection and initialization
      document.addEventListener('DOMContentLoaded', function() {
        if (window.Capacitor) {
          updateStatus('Connecting native services...');
          try {
            if (window.Capacitor.Plugins && window.Capacitor.Plugins.SplashScreen) {
              window.Capacitor.Plugins.SplashScreen.hide();
            }
          } catch (e) {
            console.warn('Splash screen hide error:', e);
          }
        } else {
          updateStatus('Ready.');
        }
      });
    })();
  </script>
</body>
</html>
